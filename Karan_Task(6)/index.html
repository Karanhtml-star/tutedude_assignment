<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page using flex</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="left"><img class="left-img" src="wm.png" alt=""></div>
        <div class="right">
            <div class="main">
                <section class="headding">
                    <h1 >Hello Again!</h1>
                    <p>Welcome Back! We Missed You</p>
                </section>
                <section class="form">
                    <form action="" > 
                        <p class="input">Email</p>
                        <input type="text" placeholder="Email@site.com">
                        <p class="input">Password</p>
                        <input type="text" placeholder="Password">
                    </form>
                    <p class="forget">forget Password</p>
                    <section class="btw"><Button>Login</Button></section>
                    <p class="end">Not a member? <span style="color: #522de7;">Register now</span></p>
                </section>
            </div>
        </div>
    </div>

</body>

</html>
