<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry service Hamburger Menu in Mobile </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><b>LOGO</b></div>

            <ul class="menu">
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
            </ul>

            <div class="username">
                <section class="user">
                    <p>Username</p>
                </section>

                <button class="btn-user">
                    <img width="20px" src="more.png" alt="">
                </button>

                <div class="side-bar">
                    <ul class="menu-res">
                        <li>Home</li>
                        <li>About</li>
                        <li>Services</li>
                        <li>Contact</li>
                    </ul>
                </div>
            </div>
    </nav>

    

</body>

</html>
